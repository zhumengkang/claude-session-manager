<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4f46e5" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect x="16" y="16" width="224" height="224" rx="52" ry="52" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- shine overlay -->
  <rect x="16" y="16" width="224" height="112" rx="52" ry="52" fill="url(#shine)"/>

  <!-- chat bubble left -->
  <rect x="44" y="72" width="118" height="80" rx="16" fill="white" opacity="0.95"/>
  <polygon points="52,152 44,172 72,152" fill="white" opacity="0.95"/>

  <!-- K letter inside bubble -->
  <text x="68" y="126" font-family="-apple-system, SF Pro Display, system-ui, sans-serif"
        font-size="52" font-weight="800" fill="#6366f1" letter-spacing="-2">K</text>
  <text x="100" y="126" font-family="-apple-system, SF Pro Display, system-ui, sans-serif"
        font-size="52" font-weight="800" fill="#8b5cf6" letter-spacing="-2">K</text>

  <!-- small dot indicator -->
  <circle cx="188" cy="76" r="22" fill="#10b981"/>
  <text x="188" y="84" font-family="-apple-system, system-ui, sans-serif"
        font-size="22" font-weight="700" fill="white" text-anchor="middle">C</text>

  <!-- bottom label -->
  <text x="128" y="210" font-family="-apple-system, SF Pro Display, system-ui, sans-serif"
        font-size="20" font-weight="600" fill="white" opacity="0.85" text-anchor="middle"
        letter-spacing="2">Sessions</text>
</svg>
