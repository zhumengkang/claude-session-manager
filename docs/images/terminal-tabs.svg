<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">一个 Terminal 窗口包含多个原生标签页</title>
  <desc id="desc">结构示意图显示三个会话在同一个窗口顶部的三个标签中恢复，而不是三个独立窗口。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="60" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="700" fill="#0f172a">批量恢复的目标结构</text>
  <text x="60" y="87" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748b">一个可见原生窗口 · 顶部多个可切换标签 · 每个标签恢复一个停止会话</text>

  <g filter="url(#shadow)">
    <rect x="90" y="120" width="1020" height="450" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <path d="M90 138 Q90 120 108 120 H1092 Q1110 120 1110 138 V175 H90 Z" fill="#e2e8f0"/>
  <circle cx="122" cy="148" r="7" fill="#fb7185"/>
  <circle cx="148" cy="148" r="7" fill="#fbbf24"/>
  <circle cx="174" cy="148" r="7" fill="#34d399"/>
  <text x="600" y="154" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#475569">Terminal — 批量会话恢复</text>

  <rect x="90" y="175" width="1020" height="64" fill="#f1f5f9"/>
  <path d="M112 189 H408 L426 225 H112 Z" fill="#dbeafe" stroke="#60a5fa"/>
  <path d="M420 189 H716 L734 225 H420 Z" fill="#e2e8f0" stroke="#cbd5e1"/>
  <path d="M728 189 H1024 L1042 225 H728 Z" fill="#e2e8f0" stroke="#cbd5e1"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600">
    <text x="270" y="215" text-anchor="middle" fill="#1d4ed8">标签 1 · Claude · project-alpha</text>
    <text x="578" y="215" text-anchor="middle" fill="#475569">标签 2 · Claude · project-beta</text>
    <text x="886" y="215" text-anchor="middle" fill="#475569">标签 3 · Codex · project-gamma</text>
  </g>

  <rect x="112" y="260" width="976" height="230" rx="12" fill="#0f172a"/>
  <circle cx="144" cy="292" r="12" fill="#6366f1"/>
  <text x="170" y="298" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">当前选中：标签 1</text>
  <text x="144" y="340" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="16" fill="#a5b4fc">cd /mock/project-alpha</text>
  <text x="144" y="376" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="16" fill="#f8fafc">claude --dangerously-skip-permissions -r SESSION_A</text>
  <text x="144" y="418" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#94a3b8">其他会话分别位于标签 2、标签 3，而不是新建独立窗口。</text>
  <text x="144" y="451" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#fbbf24">危险参数只用于用户明确选择的可信项目。</text>

  <rect x="90" y="522" width="1020" height="48" fill="#f8fafc"/>
  <text x="600" y="552" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748b">一个 AXTabGroup · 三个 AXRadioButton（真实测试中的只读结构核验方式）</text>

  <rect x="90" y="604" width="1020" height="44" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="600" y="632" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#4338ca">结构示意图，不是 Terminal 实测截图；不得仅凭 AppleScript window ID 数量判断可见窗口数量。</text>
</svg>
