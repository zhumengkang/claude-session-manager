<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Claude Session Manager 整体架构</title>
  <desc id="desc">静态前端通过 Tauri IPC 调用共享 Rust 后端，连接本地会话数据、应用状态，以及 macOS 和 Windows 平台集成。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="58" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#0f172a">整体架构</text>
  <text x="60" y="88" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748b">本地数据 · 无前端构建步骤 · 无运行时 CDN</text>

  <g filter="url(#shadow)">
    <rect x="220" y="120" width="760" height="112" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  </g>
  <rect x="244" y="143" width="86" height="66" rx="12" fill="#eef2ff"/>
  <text x="287" y="170" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#4f46e5">UI</text>
  <text x="287" y="193" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6366f1">静态资源</text>
  <text x="356" y="158" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#0f172a">src/index.html</text>
  <text x="356" y="188" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#475569">会话列表 · 搜索与分组 · 收藏多选 · 详情与 Markdown</text>
  <text x="356" y="213" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748b">HTML / CSS / JavaScript + 本地 Tabler 1.4.0</text>

  <path d="M600 234 L600 272" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="475" y="239" width="250" height="32" rx="16" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="600" y="260" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#475569">Tauri IPC · await invoke(...)</text>

  <g filter="url(#shadow)">
    <rect x="220" y="286" width="760" height="134" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
  </g>
  <rect x="244" y="310" width="86" height="86" rx="12" fill="#ecfdf5"/>
  <text x="287" y="347" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#059669">Rust</text>
  <text x="287" y="373" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#059669">Tauri 2</text>
  <text x="356" y="323" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#0f172a">main.rs + windows_platform.rs</text>
  <text x="356" y="353" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#475569">解析与分页 · 元数据缓存 · 收藏 · 运行状态 · 恢复命令</text>
  <text x="356" y="379" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748b">Serde / Chrono / Tokio / rusqlite · 平台恢复后端</text>
  <text x="356" y="402" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#64748b">后端单页最多 1000 条；详情从文件末尾按 256 KiB 反向读取</text>

  <path d="M600 422 L600 466 L170 466 L170 502" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600 422 L600 502" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600 422 L600 466 L1030 466 L1030 502" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600 422 L600 452 L740 452 L740 502" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="510" width="260" height="146" rx="16" fill="#ffffff" stroke="#bae6fd"/>
    <rect x="325" y="510" width="260" height="146" rx="16" fill="#ffffff" stroke="#ddd6fe"/>
    <rect x="610" y="510" width="260" height="146" rx="16" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="900" y="510" width="260" height="146" rx="16" fill="#ffffff" stroke="#fecdd3"/>
  </g>
  <text x="60" y="544" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#0369a1">Provider 数据</text>
  <text x="60" y="574" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">Claude projects JSONL</text>
  <text x="60" y="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">Codex rollout / 索引</text>
  <text x="60" y="626" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">state_5.sqlite（内嵌只读访问）</text>

  <text x="345" y="544" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#7c3aed">应用本地状态</text>
  <text x="345" y="574" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">favorites.json</text>
  <text x="345" y="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">session-metadata-v1.json</text>
  <text x="345" y="626" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#475569">launch.log</text>

  <text x="630" y="544" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#c2410c">终端集成</text>
  <text x="630" y="574" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#475569">macOS：OSAScript / System Events</text>
  <text x="630" y="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#475569">Windows：wt.exe / new-tab</text>
  <text x="630" y="626" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#475569">ARM64 · 原生单窗三标签已验收</text>

  <text x="920" y="544" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#be123c">平台集成</text>
  <text x="920" y="574" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#475569">macOS：ps / lsof / launchctl / TCC</text>
  <text x="920" y="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#475569">Windows：sysinfo / HKCU / Explorer</text>
  <text x="920" y="626" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#64748b">隔离集成已验收 · 真实账号待验收</text>

  <rect x="40" y="686" width="1120" height="42" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="600" y="713" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#9a3412">恢复的 Claude Code / Codex 仍按各自配置运行和联网；危险参数不等于安全沙箱。</text>
</svg>
